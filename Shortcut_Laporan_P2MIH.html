<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shortcut Laporan P2MIH</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1422;color:#e8eef8;font:14px system-ui}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 6px}p{color:#9eafc7}section{background:#172235;border:1px solid #304058;border-radius:14px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:block;color:#b9c8dc;font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;background:#0d1625;color:#fff;border:1px solid #3b4e68;border-radius:7px;padding:10px;font:inherit}textarea{resize:vertical;min-height:150px}button{background:#2874e6;color:white;border:0;border-radius:8px;padding:11px 17px;font-weight:700;cursor:pointer}button.alt{background:#34445c}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #304058}th{color:#9eafc7;font-size:12px}td input{min-width:110px}.scroll{overflow:auto}.pill{color:#fbbf24;font-weight:bold}#out{min-height:320px;white-space:pre-wrap}#notice{color:#8ee4b0}small{color:#9eafc7}</style><main><h1>SHORTCUT LAPORAN P2MIH</h1><p>Paste data transaksi → pilih status → lengkapi data → copy laporan.</p><section><div class="grid"><div><label>Info</label><input id="info" value="Linetogel"></div><div><label>Provider</label><input id="provider" value="P2MIH"></div><div><label>Toko</label><input id="toko" value="LEON PBR 1"></div><div><label>Status transaksi</label><select id="status"><option>PENDING</option><option value="GAGAL">FAILED / GAGAL</option><option>SUKSES</option></select></div><div><label>Tanggal default</label><input id="date" type="date"></div><div><label>Tag PIC</label><input id="tags" value="@Girl - TS    @Mr.GvG - Ts    @Rony.TS"></div></div></section><section><label>Paste tabel transaksi</label><textarea id="raw" placeholder="Paste tabel Markdown atau data dari Excel / Google Sheets di sini..."></textarea><div class="buttons"><button id="parse">Ambil Data</button><button class="alt" id="reset">Reset</button></div><p id="stats">Belum ada data.</p></section><section><h3>Data transaksi terpilih</h3><small>Lengkapi User ID, tanggal dan lampiran yang belum tersedia. Data tidak ditebak.</small><div class="scroll"><table><thead><tr><th>No.</th><th>Tanggal</th><th>User ID</th><th>Order ID</th><th>Nominal</th><th>Status</th><th>Lampiran</th></tr></thead><tbody id="rows"></tbody></table></div><div class="buttons"><button id="generate">Generate Laporan</button></div></section><section><h3>Hasil laporan</h3><textarea id="out" placeholder="Hasil laporan muncul di sini..."></textarea><div class="buttons"><button id="copy">Copy Laporan</button><span id="notice"></span></div></section></main><script>
const $=id=>document.getElementById(id);let data=[];const fmt=n=>Number(n).toLocaleString('en-US');const localDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').value=localDate();function clean(s){return s.replace(/\*\*/g,'').trim()}function norm(s){s=clean(s).toUpperCase();return /^(FAILED|FAIL|GAGAL)$/.test(s)?'GAGAL':/^(SUCCESS|SUKSES|BERHASIL)$/.test(s)?'SUKSES':s==='PENDING'?'PENDING':''}function selected(){return data.filter(r=>r.status===$('status').value)}function render(){let list=selected();$('stats').textContent=`Total ${data.length} | Pending ${data.filter(r=>r.status==='PENDING').length} | Gagal ${data.filter(r=>r.status==='GAGAL').length} | Sukses ${data.filter(r=>r.status==='SUKSES').length} | Ditampilkan ${list.length} | Nominal ${fmt(list.reduce((a,r)=>a+r.amount,0))}`;$('rows').replaceChildren();list.forEach((r,i)=>{let tr=document.createElement('tr');function cell(t){let td=document.createElement('td');td.textContent=t;tr.append(td);return td}function edit(k,type='text'){let td=cell(''),el=document.createElement('input');el.type=type;el.value=r[k];el.oninput=()=>{r[k]=el.value;$('out').value=''};td.append(el)}cell(i+1);edit('date','date');edit('user');cell(r.id);cell(fmt(r.amount));cell(r.status).className='pill';edit('link');$('rows').append(tr)})}function parse(){let next=[],seen=new Set(),skipped=0;for(let line of $('raw').value.split(/\r?\n/)){let id=line.match(/LIT-[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}/i);if(!id)continue;let cells=line.split(line.includes('|')?'|':'\t').map(clean).filter(Boolean),idx=cells.findIndex(c=>c.includes(id[0])),st=cells.map(norm).find(Boolean);let amount=cells[idx+1]?.replace(/^Rp\.?\s*/i,'').trim();if(!st||!amount||!/^\d+(?:[,.]\d{3})*$/.test(amount)){skipped++;continue}let key=id[0].toLowerCase();if(seen.has(key)){skipped++;continue}seen.add(key);let link=line.match(/https?:\/\/[^\s\])>*|]+/i)?.[0]||'';next.push({id:id[0],amount:Number(amount.replace(/[,.]/g,'')),status:st,date:$('date').value,user:'',link})}data=next;render();$('out').value='';$('notice').textContent=skipped?`${skipped} baris tidak valid atau duplikat dilewati.`:''}function generate(){let list=selected();if(!list.length){$('out').value='';$('notice').textContent='Tidak ada transaksi dengan status ini.';return}let status=$('status').value,word={PENDING:'Pending',GAGAL:'Gagal',SUKSES:'Sukses'}[status],p=$('provider').value.trim();let text=`Info : ${$('info').value}\nPerihal : WD ${p} ${word}\nToko : ${$('toko').value}\n\n`;let groups=new Map();for(let r of list){let d=r.date||$('date').value||'';if(!groups.has(d))groups.set(d,[]);groups.get(d).push(r)}for(let d of [...groups.keys()].sort()){let label=d?new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'[Tanggal belum diisi]';text+=`Tanggal ${label}\n\n`;for(let r of groups.get(d)){text+=`User id : ${r.user||'[Belum diisi]'}\nOrder id : ${r.id}\nNominal : ${fmt(r.amount)}\nLampiran : ${r.link||'[Belum diisi]'}\n\n`}}let desc=status==='PENDING'?'yang hingga saat ini masih berstatus pending':status==='GAGAL'?'yang berstatus gagal':'yang tercatat berstatus sukses';text+=`Keterangan : Mohon dibantu pengecekan terhadap ${list.length} transaksi withdraw QRIS ${p} di atas ${desc} ya, ko/ci. Terima kasih.\n${$('tags').value}`;$('out').value=text;$('notice').textContent=list.some(r=>!r.user||!r.link)?'Periksa User ID dan lampiran yang belum diisi.':'Laporan siap disalin.'} $('parse').onclick=parse;$('status').onchange=()=>{render();$('out').value=''};$('generate').onclick=generate;$('reset').onclick=()=>{data=[];$('raw').value='';$('out').value='';$('notice').textContent='';render()};$('copy').onclick=async()=>{if(!$('out').value)return;try{await navigator.clipboard.writeText($('out').value)}catch(e){$('out').select();if(!document.execCommand('copy')){$('notice').textContent='Tekan Ctrl+C untuk menyalin.';return}}$('notice').textContent='Laporan berhasil disalin.'};$('date').onchange=()=>{data.forEach(r=>r.date=$('date').value);render();$('out').value=''};
</script></html>
